services:
 nginx:
   image: nginx:alpine
   container_name:proxy-nginx
   ports:
   - "80:80"
   volumes:
   - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
   depends-on:
   - app-backend
   networks:
   - red-cba

   servidor-bd:
     image: mysql:8.0
     container_name:servidor-bd-ejemplo
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
      volumes:
      - msql-data:/var/lib/mysql
      networks:
       - red-cba
      depends_on:
       
       - servidor-bd
networks:
red-cba:
  name: red-cba-ejemplo


